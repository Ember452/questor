name: Bug report
description: 报告一个问题
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        安全漏洞请**不要**开公开 issue，见 SECURITY.md。
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 简明描述问题
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      value: |
        1.
        2.
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: 期望结果 }
  - type: textarea
    id: env
    attributes:
      label: 环境
      description: OS / Python 版本 / Questor 版本 / 模型 provider
  - type: textarea
    id: logs
    attributes: { label: 相关日志（已脱敏，勿含 API key）, render: logs }
