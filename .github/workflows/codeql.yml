name: codeql

# SAST：Python 内核 + 桌面前端 TS。
# build-mode:none —— 无需完整构建即可解析源码，避免 runner 上因构建失败而漏扫。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 2" # 每周二 03:17 UTC 全量重扫（advisory/查询更新后）
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/_changes.yml

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.python == 'true' || needs.changes.outputs.desktop == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          build-mode: none
