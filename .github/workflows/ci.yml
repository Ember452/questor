name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PYTHONFAULTHANDLER: "1"
  PYTHONUTF8: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: guards
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --extra dev --frozen

      # 契约 TS 侧 codegen 守卫需要 node 与生成器依赖（scripts/codegen）。
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install wire codegen deps
        run: npm ci --prefix scripts/codegen --no-fund --no-audit --loglevel=error

      - name: Install web deps
        run: npm ci --prefix apps/web --no-fund --no-audit --loglevel=error

      - name: Pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Guards and import contracts
        run: |
          uv run python scripts/check.py --list
          uv run python scripts/check.py

      - name: Failure diagnostics
        if: failure()
        shell: bash
        run: |
          echo "::group::Environment"
          python --version
          uv --version
          python -c "import platform; print(platform.platform())"
          echo "::endgroup::"
          echo "::group::Git status"
          git status --short
          git diff --stat
          echo "::endgroup::"

  tests:
    name: tests (windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --extra dev --frozen

      # tests 里含 tests/ci/test_wire_codegen.py（TS 侧 codegen 守卫），同样需要生成器依赖。
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install wire codegen deps
        run: npm ci --prefix scripts/codegen --no-fund --no-audit --loglevel=error

      # check.py 的 web lane 需要 apps/web 的 node_modules。
      - name: Install web deps
        run: npm ci --prefix apps/web --no-fund --no-audit --loglevel=error

      - name: Unit and integration tests
        run: uv run pytest -m "unit or integration" -ra --tb=long --durations=20

      - name: Failure diagnostics
        if: failure()
        shell: bash
        run: |
          echo "::group::Environment"
          python --version
          uv --version
          python -c "import platform; print(platform.platform())"
          echo "::endgroup::"
          echo "::group::Git status"
          git status --short
          git diff --stat
          echo "::endgroup::"

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci --no-fund --no-audit --loglevel=error

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build (web)
        run: npm run build:web

  desktop:
    name: desktop
    runs-on: windows-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Syntax check
        run: npm run check

      - name: Updater rollback matrix
        run: npm test
