name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PYTHONFAULTHANDLER: "1"
  PYTHONUTF8: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: guards
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --extra dev --frozen

      - name: Pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Guard self-tests
        run: |
          uv run python scripts/guards/_guard_kit.py --self-test
          uv run python scripts/guards/check_thread_leak.py --self-test
          uv run python scripts/guards/check_secret_projection.py --self-test
          uv run python scripts/guards/check_doc_cross_refs.py --self-test

      - name: Guards and import contracts
        run: |
          uv run python scripts/guards/check_thread_leak.py --fail-on-empty
          uv run python scripts/guards/check_secret_projection.py --fail-on-empty
          uv run python scripts/guards/check_doc_cross_refs.py --fail-on-empty
          uv run lint-imports

      - name: Failure diagnostics
        if: failure()
        shell: bash
        run: |
          echo "::group::Environment"
          python --version
          uv --version
          python -c "import platform; print(platform.platform())"
          echo "::endgroup::"
          echo "::group::Git status"
          git status --short
          git diff --stat
          echo "::endgroup::"

  tests:
    name: tests (windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --extra dev --frozen

      - name: Unit and integration tests
        run: uv run pytest -m "unit or integration" -ra --tb=long --durations=20

      - name: Failure diagnostics
        if: failure()
        shell: bash
        run: |
          echo "::group::Environment"
          python --version
          uv --version
          python -c "import platform; print(platform.platform())"
          echo "::endgroup::"
          echo "::group::Git status"
          git status --short
          git diff --stat
          echo "::endgroup::"
