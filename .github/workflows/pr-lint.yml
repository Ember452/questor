name: pr-lint

# PR 标题规范（参考 crewAI pr-title）：项目已强制 Conventional Commits，这里在 CI 侧兜住。
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    name: Conventional Commit title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            perf
            test
            docs
            chore
            ci
            build
            style
            revert
          requireScope: false
          subjectPattern: ^[a-z].+[^.]$
          subjectPatternError: >
            PR 标题 "{title}" 不符合 Conventional Commits。
            期望：<type>(<scope>): <小写描述、句尾无句号>
            例：feat(desktop): add sidecar_status lifecycle
