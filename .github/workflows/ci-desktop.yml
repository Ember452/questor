name: ci-desktop

# P7 §6-2: 桌面 lane 独立 blocking——前端(tsc/vitest/vite) + Rust(questor-sidecar 跨平台、
# src-tauri 走 windows/WebView2)。不挂 python change-classifier：桌面/前端改动或契约变更都能被兜住。
# 诚实边界：本 workflow 在 GitHub runner 上的真实执行属 UNVERIFIED（本仓 agent 无 runner 权限）；
# 每一步的本地等价命令（cargo fmt/clippy/test、npm typecheck/test/build）均已在开发机实测通过。
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-desktop-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # Linux：前端 + questor-sidecar（纯 std 生命周期 crate，无系统依赖，跨平台可 cargo test）。
  web-and-sidecar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: desktop/web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Web — install, typecheck, unit tests, production build
        working-directory: desktop/web
        run: |
          npm ci
          npm run typecheck
          npm run test
          npm run build
      - name: questor-sidecar — fmt + clippy(-D warnings) + test
        working-directory: desktop/sidecar
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  # Windows：Tauri v2 壳需 WebView2 + MSVC（GitHub windows runner 具备）。
  shell-windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: src-tauri — fmt + clippy(-D warnings) + test
        working-directory: desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
