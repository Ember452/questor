# 个人形态：人设 / 记忆 / 日程 / 渠道 / 会话。
# 首批五个 page id 只登记命名与能力位（declared = 已声明、未就绪，入口不出现）。
#
# 工具面与编码形态不同：个人形态不进代码编辑/执行面，因此显式拒绝编码专属工具；
# 提问工具无需审批即可放行（无副作用）。名字全部取自 create_default_tool_registry()。
name: personal
description: 个人形态：人设、记忆、日程、渠道会话与对话。
is_default: false
model: null
provider: null
skill_dirs: []
plugin_roots: []
allowed_tools:
  - ask_user_question
denied_tools:
  - bash
  - edit_file
  - write_file
  - notebook_edit
  - enter_worktree
  - exit_worktree
ui:
  capabilities:
    chat: declared
    persona: declared
    memory: declared
    schedule: declared
    channels: declared
