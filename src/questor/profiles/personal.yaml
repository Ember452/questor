# 个人形态：人设 / 记忆 / 日程 / 渠道 / 会话。
# 首批五个 page id 只登记命名与能力位（declared = 已声明、未就绪，入口不出现）。
#
# 工具面与编码形态不同：个人形态不进代码编辑/执行面，因此显式拒绝编码专属工具；
# 提问工具无需审批即可放行（无副作用）。名字全部取自 create_default_tool_registry()。
name: personal
description: 个人形态：人设、记忆、日程、渠道会话与对话。
is_default: false
model: null
provider: null
skill_dirs: []
plugin_roots: []
allowed_tools:
  - ask_user_question
denied_tools:
  - bash
  - edit_file
  - write_file
  - notebook_edit
  - enter_worktree
  - exit_worktree
ui:
  capabilities:
    chat: declared
    persona: declared
    memory: declared
    schedule: declared
    channels: declared
# runtime 能力位：本阶段只立位、不接消费方；三个键必须显式声明（缺失视为全 off）。
# 未来消费方登记（计划 04，裁决本体见 docs/adr/0009-proactive-runtime.md）：
#   schedule           → A4 触发层升级（at/every 触发、跨进程 claim、进程内回合 runner）
#   delivery           → A5-lite 守门器与投递（每日上限 / 安静时段 / 跳过可观测，feishu_dm）
#   memory_consumption → A3d 检索降级链（keyword → trigram → LIKE，注入端口落 providers/store）
runtime:
  schedule: off
  delivery: off
  memory_consumption: off
