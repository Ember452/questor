repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: ruff-critical
        name: ruff critical errors
        entry: uv run ruff check --select E9,F63,F7,F82
        language: system
        types: [python]

      - id: repo-guards
        name: repository guards via scripts/check.py
        entry: uv run python scripts/check.py --fast
        language: system
        pass_filenames: false

      - id: repo-guards-full
        name: repository guards incl snapshot checks via scripts/check.py
        entry: uv run python scripts/check.py
        language: system
        pass_filenames: false
        stages: [pre-push]
