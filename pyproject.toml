[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "questorharness-ai"
version = "0.1.0"
description = "QuestorHarness: a local-first AI coding assistant engine"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"

dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "textual>=0.80.0",
    "typer>=0.12.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "mcp>=1.0.0",
    "pyperclip>=1.9.0",
    "pyyaml>=6.0",
    "questionary>=2.0.1",
    "watchfiles>=0.20.0",
    "croniter>=2.0.0",
    "tzdata; sys_platform == 'win32'",
    "lark-oapi>=1.5.0",
    "qq-botpy>=1.2.1",
]

[project.optional-dependencies]
dev = [
    "pexpect>=4.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
questorharness = "questorharness.cli:app"
oh = "questorharness.cli:app"
openh = "questorharness.cli:app"
questor = "questor.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/questorharness", "src/questor"]

[tool.hatch.build]
exclude = [
    "/.git",
    "/.venv",
    "/.questorharness-venv",
    "/.questorharness",
    "/.pytest_cache",
    "/.mypy_cache",
    "/.ruff_cache",
    "/build",
    "/dist",
]

[tool.hatch.build.targets.wheel.force-include]
"frontend/terminal/package.json" = "questorharness/_frontend/package.json"
"frontend/terminal/tsconfig.json" = "questorharness/_frontend/tsconfig.json"
"frontend/terminal/src" = "questorharness/_frontend/src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
