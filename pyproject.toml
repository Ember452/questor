[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "questorharness-ai"
version = "0.1.0"
description = "QuestorHarness: a local-first AI coding assistant engine"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"

dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "mcp>=1.0.0",
    "pyperclip>=1.9.0",
    "pyyaml>=6.0",
    "questionary>=2.0.1",
    "prompt-toolkit>=3.0.0",
    "watchfiles>=0.20.0",
    "croniter>=2.0.0",
    "tzdata; sys_platform == 'win32'",
    "lark-oapi>=1.5.0",
    "qq-botpy>=1.2.1",
    "aiohttp>=3.14.5",
]

[project.optional-dependencies]
dev = [
    "pexpect>=4.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "import-linter>=2.0.0",
    "pytest-timeout>=2.4.0",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[project.scripts]
questorharness = "questorharness.bootstrap.cli.main:app"
oh = "questorharness.bootstrap.cli.main:app"
openh = "questorharness.bootstrap.cli.main:app"
questor = "questor.cli:app"

[project.entry-points."questorharness.notification_handlers"]
questor-feishu = "questor.gateway.notify:register_handlers"

[tool.hatch.build.targets.wheel]
packages = ["src/questorharness", "src/questor"]

[tool.hatch.build]
exclude = [
    "/.git",
    "/.venv",
    "/.questorharness-venv",
    "/.questorharness",
    "/.questor",
    "/.pytest_cache",
    "/.mypy_cache",
    "/.ruff_cache",
    "/build",
    "/dist",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# 每个用例 60s 硬上限（thread 法：Windows 没有 signal）——挂死的测试立刻带着
# 全线程栈死掉，而不是烧光整个 30 分钟的 CI tests job。规模触发的扩容手段
# （分片/xdist）见 docs/operations/ci.md，由 scripts/guards/check_test_infra_policy.py 把关。
addopts = "-m 'not e2e' --timeout=60 --timeout-method=thread"
markers = [
    "unit: fast, isolated tests",
    "integration: tests that cross process, filesystem, transport, or service boundaries",
    "e2e: real end-to-end suites requiring external services or a built frontend",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
# 分析平台钉死为 win32:typeshed 会按运行平台裁剪 msvcrt/fcntl 等属性,
# 不钉的话本地(Windows)与 CI(Ubuntu)对 platform/locking.py 会给出相反的
# 结论——一边是 unused type: ignore,一边是 attr-defined。严格白名单的
# 验证基线在 Windows,两边按同一平台语义检查才有可比性。
platform = "win32"
strict = true
# ``src/__init__.py`` makes ``src`` a package, so mypy would otherwise name the
# same file ``src.questorharness...`` and ``questorharness...``. Pin the base.
mypy_path = "src"
explicit_package_bases = true
# Whitelist, never an exclusion list: a package joins here after it reaches zero
# errors, and scripts/guards/check_mypy_scope.py keeps new modules from silently
# staying outside. W4 starts with contracts + platform + config (22 modules).
files = [
    "src/questorharness/contracts",
    "src/questorharness/platform",
    "src/questorharness/config",
    # W8 unit 1 moved bundled discovery into a new module; it joins the strict
    # whitelist instead of inflating the deferred pool (plan 01 P3: pool counts
    # may only shrink).
    "src/questorharness/capabilities/skills/bundled/discovery.py",
    # 阶段 1：形态加载器与 serve 宿主零错误，直接进严格白名单（不抬高 deferred 池）。
    "src/questorharness/profiles",
    "src/questorharness/bootstrap/hosts/serve",
    # W8 unit 2: both halves of the split lsp helpers join the strict whitelist
    # instead of enlarging the deferred pool.
    "src/questorharness/providers/lsp/python_index.py",
    "src/questorharness/providers/lsp/symbol_queries.py",
    # W8: the two halves of the split session-memory facade.
    "src/questorharness/capabilities/memory/session/document.py",
    "src/questorharness/capabilities/memory/session/store.py",
    # W8: the three halves of the split memory-extraction facade.
    "src/questorharness/capabilities/memory/extract/records.py",
    "src/questorharness/capabilities/memory/extract/guard.py",
    "src/questorharness/capabilities/memory/extract/extraction.py",
    # W8/W10: the terminal-prompt layer split out of the CLI entry point joins the
    # strict whitelist for the same reason as the other split halves above.
    "src/questorharness/bootstrap/cli/cli_prompts.py",
    # W8 second cut: the wizard and the auth group leave the entry point with their
    # annotations intact, so they join the whitelist rather than the deferred pool.
    "src/questorharness/bootstrap/cli/setup.py",
    "src/questorharness/bootstrap/cli/auth_commands.py",
    # W8: the gateway redaction layer, cut out of runtime.py with its annotations intact.
    "src/questor/gateway/redaction.py",
    # W8: the two halves of the retired channels/helpers bucket came out fully annotated,
    # so they join the strict whitelist instead of enlarging the deferred pool.
    "src/questorharness/surfaces/channels/filenames.py",
    "src/questorharness/surfaces/channels/message_chunks.py",
]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# PyYAML ships no stubs; remove this override once types-PyYAML is a dependency.
module = ["yaml"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
